spring:
  application:
    name: tp3-analytics
  cloud:
    function:
      definition: aggregateSales
    stream:
      kafka:
        streams:
          binder:
            brokers: ${KAFKA_BROKERS:localhost:9092}
            applicationId: tp3-sales-analytics-v1
            configuration:
              default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
              default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        aggregateSales-in-0:
          destination: sales-events
        aggregateSales-out-0:
          destination: sales-analytics
