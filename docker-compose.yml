services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.13
    container_name: tp3-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/2181'"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-log:/var/lib/zookeeper/log

  broker:
    image: confluentinc/cp-kafka:7.7.13
    container_name: tp3-kafka-broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data

  producer:
    profiles: [full]
    build:
      context: .
      dockerfile: producer-service/Dockerfile
    ports: ["8081:8081"]
    environment:
      KAFKA_BROKERS: broker:29092
    depends_on:
      broker:
        condition: service_healthy

  consumer:
    profiles: [full]
    build:
      context: .
      dockerfile: consumer-service/Dockerfile
    ports: ["8082:8082"]
    environment:
      KAFKA_BROKERS: broker:29092
    depends_on:
      broker:
        condition: service_healthy

  supplier:
    profiles: [full]
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    environment:
      KAFKA_BROKERS: broker:29092
    depends_on:
      broker:
        condition: service_healthy

  analytics:
    profiles: [full]
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    environment:
      KAFKA_BROKERS: broker:29092
    depends_on:
      broker:
        condition: service_healthy

  dashboard:
    profiles: [full]
    build:
      context: .
      dockerfile: dashboard-service/Dockerfile
    ports: ["8080:8080"]
    environment:
      KAFKA_BROKERS: broker:29092
    depends_on:
      broker:
        condition: service_healthy

volumes:
  zk-data:
  zk-log:
  kafka-data:
